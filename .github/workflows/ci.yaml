name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# F-AUDIT-53: this workflow was two `echo` steps — "Setup ci" / "Run ci" — so
# it had never gated anything despite being the repository's primary CI
# definition. GitHub additionally never read it at all: every workflow lived in
# `Backend/.github/workflows/`, and GitHub only loads
# `<repo-root>/.github/workflows/`. The whole set has been moved to the repo
# root (see the `git mv` in this commit) and the stubs replaced with the gates
# the project actually needs.
#
# This workflow is the fast, always-required gate. The heavier per-area
# workflows (rust-test, security-scan, docker-build, …) run alongside it.
jobs:
  ci:
    defaults:
      run:
        working-directory: Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The repository boundary rules: no cross-engine imports, and only
      # integration-gateway may depend on the integrations crate. These are
      # architectural constraints that no compiler enforces, so they are
      # checked explicitly and fail the build when violated.
      - name: Engine boundary check
        run: bash tools/scripts/check_boundaries.sh

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Contract artifacts are present and well-formed
        # The canonical contract is the source of truth for every service
        # route; if it is empty, truncated, or missing its top-level keys, the
        # conformance tests below would silently degrade to "nothing to check".
        #
        # F-AUDIT-74: this previously parsed both files with PyYAML, which
        # failed on the canonical contract with
        #   yaml.parser.ParserError: while parsing a flow mapping
        # even though the document is well-formed — the contract uses long
        # inline flow mappings that PyYAML chokes on, and nothing else in the
        # project parses it that way. A gate that reports a false failure is
        # worse than a narrower gate that reports truthfully, so this checks
        # structure without a third-party parser dependency. Full schema
        # validation belongs to a tool that can actually parse OpenAPI.
        run: |
          set -euo pipefail
          api=../Contract/openapi/lcc-api-canonical.yaml
          rt=../Contract/realtime/lcc-realtime-contract.yaml
          for f in "$api" "$rt"; do
            test -s "$f" || { echo "::error file=$f::missing or empty"; exit 1; }
          done
          # The REST contract is rooted at `openapi:`; the realtime contract is
          # not an OpenAPI document at all — it is rooted at `version:` and
          # `channels:`.
          grep -q '^openapi:' "$api" || {
            echo "::error file=$api::no top-level 'openapi:' key — the contract is truncated or not the canonical document"
            exit 1
          }
          grep -q '^paths:' "$api" || {
            echo "::error file=$api::no top-level 'paths:' key"
            exit 1
          }
          grep -q '^components:' "$api" || {
            echo "::error file=$api::no top-level 'components:' key"
            exit 1
          }
          grep -q '^channels:' "$rt" || {
            echo "::error file=$rt::no top-level 'channels:' key — the realtime contract is truncated"
            exit 1
          }
          grep -q '^definitions:' "$rt" || {
            echo "::error file=$rt::no top-level 'definitions:' key"
            exit 1
          }
          echo "contract artifacts present and structurally intact"
          echo -n "declared REST paths: "
          grep -cE '^  /' "$api"

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Tests
        # Suites that need a database skip themselves; they run for real in
        # rust-test.yaml, which provisions a Postgres service.
        run: cargo test --workspace --all-features
