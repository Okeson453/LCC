name: Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    defaults:
      run:
        working-directory: Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # F-AUDIT-30: was two `echo` steps — ruff and mypy never ran.
      # F-AUDIT-70: `enable-cache: true` requires a committed uv.lock, and
      # the repository has none, so setup-uv aborted with
      #   No file in .../LCC matched to [**/uv.lock]
      # before the workflow did any work. Caching is re-enabled once a lock is
      # committed; until then it is a cache hint, not a gate, so it must not
      # fail the job.
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # F-AUDIT-70: `uv sync --frozen` also requires a lockfile and fails
      # without one. Resolve the lock in-run so resolution problems are still a
      # hard failure, and so `--frozen` then installs exactly what was resolved.
      - name: Resolve dependencies
        run: uv lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --frozen --all-extras --dev

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format --check
        run: uv run --frozen ruff format --check .
