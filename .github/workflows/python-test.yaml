name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    defaults:
      run:
        # F-AUDIT-72: the Python project is `engine/intelligence`
        # (name = "lcc-engine-intelligence"), not `Backend`. `Backend/pyproject.toml`
        # is a stale duplicate with the same dependency list, and resolving it
        # fails setuptools auto-discovery outright. These gates now run against
        # the project that actually holds the intelligence services.
        working-directory: Backend/engine/intelligence
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # F-AUDIT-30: this workflow was two `echo` steps. No interpreter was
      # installed, no dependencies resolved, and `pytest` never ran — so every
      # Python test in the repository had never executed in CI. That is the root
      # cause that let the Intelligence Engine's spec-invariant violations
      # (uncalibrated rho, unbound cost budget, un-enforced grounding,
      # unauthenticated parity checks) reach main unnoticed.
      # F-AUDIT-70: `enable-cache: true` requires a committed uv.lock, and
      # the repository has none, so setup-uv aborted with
      #   No file in .../LCC matched to [**/uv.lock]
      # before the workflow did any work. Caching is re-enabled once a lock is
      # committed; until then it is a cache hint, not a gate, so it must not
      # fail the job.
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # F-AUDIT-70: `uv sync --frozen` also requires a lockfile and fails
      # without one. Resolve the lock in-run so resolution problems are still a
      # hard failure, and so `--frozen` then installs exactly what was resolved.
      - name: Resolve dependencies
        run: uv lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --frozen --all-extras --dev

      - name: Run pytest
        run: uv run --frozen pytest ../../tests -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: .coverage
          if-no-files-found: ignore
