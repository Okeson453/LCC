name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    defaults:
      run:
        working-directory: Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # F-AUDIT-30: was two `echo` steps. `Cargo.lock` is a 9-line
      # placeholder, so `cargo deny` / `cargo audit` had no real dependency
      # graph to scan. `--frozen` below will surface that immediately rather
      # than silently reporting "no vulnerabilities found" from an empty set.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # F-AUDIT-68: like buf-action, a `uses:` step ignores
      # `defaults.run.working-directory` and runs at the repository root, where
      # there is no Cargo.toml — so the action failed to find a manifest. The
      # manifest is now named explicitly.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: Backend/Cargo.toml
      - name: Python dependency audit
        uses: astral-sh/setup-uv@v3
      # F-AUDIT-69: the `|| echo "audit skipped"` made this step report
      # SUCCESS whenever the audit did not actually run — a security gate that
      # cannot fail is worse than no gate, because it is mistaken for coverage.
      # A real failure (or a genuinely unavailable export) must now be visible.
      - name: pip-audit
        run: |
          set -euo pipefail
          uv export --no-hashes --all-extras --no-emit-project > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt
