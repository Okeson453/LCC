# OKESON-LCC clippy policy
# Engine boundary: deny crates/integrations outside integration-gateway.
disallowed-methods = []
disallowed-types = []
avoid-breaking-exported-api = false

# Cognitive complexity limit
cognitive-complexity-threshold = 30

# Too-many-arguments threshold
too-many-arguments-threshold = 8

# Single-character loop variable names disallowed (except for `i`, `j`, `k` in tightly-scoped loops)
single-char-binding-names-threshold = 5

# Idents clippy's doc lint treats as camel-case words rather than
# "unusual capitalization" (LinkedIn, OAuth, PostgreSQL, ...).
#
# This was previously under a `[doc]` section, which is not a clippy config
# table. Clippy ignored the whitelist entirely, and newer versions refuse to
# load the file at all, so the lint never ran.
doc-valid-idents = ["LinkedIn", "OAuth", "PKCE", "TLS", "mTLS", "gRPC", "PostgreSQL", "Qdrant", "Rust", "Python", "JWT", "HTTP", "HTTPS", "API", "URL", "UUID", "UUIDv7", "SDK", "Redis", "Vault", "KMS"]

