# ccfg-2025-01-01-rc1 — initial compliance configuration.
#
# This file is deserialised by `lcc_compliance::config::ComplianceConfig`, so
# the keys below ARE the schema. It previously used a nested shape
# (`h_c.weights.{response_rate,acceptance_rate,...}`) that the loader could not
# read at all, so the Governor could not start against any config in the repo.
#
# The old file also carried narrative sections (ab_d decay steps, rho
# rule-based weights, grounding, track_routing, restriction_signals, ...) that
# no field in `ComplianceConfig` maps to. They are gone rather than left in
# place: serde ignores unknown keys, so keeping them would look authoritative
# while having no effect. See `ComplianceConfig` for the real field list.
#
# Validation invariants (enforced by `ComplianceConfig::validate`):
#   - sum(h_c_weights) == 1.0 ±1e-6
#   - every h_c_weights entry is in (0, 1]
#   - h_c_warmup_threshold < h_c_standard_threshold
#
# Note the threshold semantics: `h_c_warmup_threshold` is the H_c *below* which
# an account is treated as still warming up, and `h_c_standard_threshold` is the
# H_c *above* which it counts as fully standard. They are the ends of an
# interpolation band, not the upper bound of a named band as the previous
# nested files described them.
#   - reserve_fraction ∈ [0, 0.30]
#   - phi_weights sum to 1.0 ±1e-6
#   - ab_d_multiplier_floor ∈ [0, 1]

version: ccfg-2025-01-01-rc1

# H_c is a weighted sum over four inputs — acceptance_rate, reply_rate,
# inverted quota_utilization, tenure_factor. The previous five named weights
# described a different scorer and do not map onto these four; the §4 initial
# default is used instead.
h_c_weights: [0.35, 0.25, 0.20, 0.20]
h_c_warmup_threshold: 0.4
h_c_standard_threshold: 0.7
reserve_fraction: 0.10

# Daily caps — Source §12, Scenario B.
caps:
  connection_request: 18
  direct_message: 25
  comment: 15
  like: 40
  profile_edit_submission: 3
  post_publish: 3

# Warm-up floor caps for new accounts (H_c < 0.3, days 1-28) — Scenario C.
warm_up_floor_caps:
  connection_request: 5
  direct_message: 6
  comment: 4
  like: 10
  profile_edit_submission: 1
  post_publish: 1

# Minimum inter-action spacing, in seconds.
min_spacing_seconds:
  connection_request: 90
  direct_message: 60
  comment: 45
  like: 15

# Minimum H_c required before a tier may act at all.
risk_tier_min_h_c:
  tier_1: 0.0
  tier_2: 0.3
  tier_3: 0.4
  tier_4: 0.5
  tier_5: 0.5

# φ (job-track opportunity) weights and qualification threshold.
phi_weights: [0.35, 0.30, 0.20, 0.15]
phi_qualification_threshold: 0.65

# AB/D multiplier floor — how far the adaptive multiplier may fall.
ab_d_multiplier_floor: 0.5

# Repeat-contact cooldown and session pacing jitter.
duplicate_target_cooldown_days: 90
session_jitter_min_seconds: 8

# Permit token lifetime. Axiom 1 caps this at 60s.
permit_token_ttl_seconds: 60

# The LinkedIn API actions this member is allowed to route to Track A.
# Everything else is Track B (browser extension).
api_supported_set_json: '["organization_page_post_publish","oauth_profile_read","jobs_data_read"]'
