# ccfg-2025-01-15-rc2 — second compliance configuration.
#
# Same schema as ccfg-2025-01-01-rc1 (see that file for why the loader's flat
# shape is the schema), with tightened daily caps, a stricter grounding-era
# reserve, and a longer duplicate-target cooldown.

version: ccfg-2025-01-15-rc2

h_c_weights: [0.35, 0.25, 0.20, 0.20]
h_c_warmup_threshold: 0.48
h_c_standard_threshold: 0.75
reserve_fraction: 0.15

# Daily caps — tighter than rc1 on the high-volume types.
caps:
  connection_request: 12
  direct_message: 16
  comment: 12
  like: 30
  profile_edit_submission: 3
  post_publish: 2

warm_up_floor_caps:
  connection_request: 4
  direct_message: 4
  comment: 3
  like: 8
  profile_edit_submission: 1
  post_publish: 1

min_spacing_seconds:
  connection_request: 120
  direct_message: 90
  comment: 60
  like: 20

risk_tier_min_h_c:
  tier_1: 0.0
  tier_2: 0.35
  tier_3: 0.45
  tier_4: 0.55
  tier_5: 0.6

phi_weights: [0.35, 0.30, 0.20, 0.15]
phi_qualification_threshold: 0.70

ab_d_multiplier_floor: 0.4

duplicate_target_cooldown_days: 120
session_jitter_min_seconds: 8

permit_token_ttl_seconds: 60

api_supported_set_json: '["organization_page_post_publish","oauth_profile_read","jobs_data_read"]'
