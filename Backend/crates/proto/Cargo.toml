[package]
name = "lcc-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Default: use hand-written protobuf message types. This avoids the build-time
# dependency on `protoc` and `buf` while still letting the gRPC client and
# server side compile. The `tonic::include_proto!` macros are guarded by the
# `proto-binary` feature, which is opt-in (set it via:
#   cargo build --features lcc-proto/proto-binary
# when `buf` is available and the pre-generated stubs are in src/gen/).
default = []
# `proto-types` is only needed by the generated `proto-binary` code.
proto-binary = ["dep:prost-types"]

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
# Required by the code `tonic-build` generates for `proto-binary` (the
# well-known types like google.protobuf.Timestamp are emitted against
# `prost_types`). Optional so the default hand-written build doesn't pull it in.
prost-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
lcc-error = { path = "../error" }

# Validates that the canonical OpenAPI + realtime contract under
# `<repo>/Contract/` still declare every endpoint and event the design
# requires. It was orphaned (no `[[test]]` target), so the contract could
# silently drift with nothing failing.
[[test]]
name = "canonical_contract_test"
path = "../../tests/contract/canonical/canonical_contract_test.rs"

[lints]
workspace = true

# `build.rs` drives `tonic-build` to generate the `src/gen/*.rs` stubs that the
# `proto-binary` feature includes. It is a build-dependency only, so it never
# reaches the default (hand-written types) build's dependency graph.
[build-dependencies]
tonic-build = "0.12"
