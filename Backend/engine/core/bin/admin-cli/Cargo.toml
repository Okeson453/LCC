[package]
name = "lcc-admin-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Proprietary"
# F-AUDIT-85: proprietary monorepo, never published; see [workspace.package].
publish = false

[[bin]]
name = "lcc-admin-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
