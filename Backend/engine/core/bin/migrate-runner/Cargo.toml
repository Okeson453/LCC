[package]
name = "lcc-migrate-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Proprietary"
# F-AUDIT-85: proprietary monorepo, never published; see [workspace.package].
publish = false

[[bin]]
name = "lcc-migrate-runner"
