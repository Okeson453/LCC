[package]
name = "lcc-identity-svc"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Proprietary"
# F-AUDIT-85: proprietary monorepo, never published; see [workspace.package].
publish = false

[[bin]]
name = "lcc-identity-svc"
path = "src/main.rs"

[lib]
name = "lcc_identity_svc"
path = "src/lib.rs"

[dependencies]
lcc-error = { path = "../../../../crates/error" }
lcc-config = { path = "../../../../crates/config" }
lcc-observability = { path = "../../../../crates/observability" }
lcc-auth = { path = "../../../../crates/auth" }
lcc-audit-client = { path = "../../../../crates/audit-client" }
lcc-events = { path = "../../../../crates/events" }
lcc-proto = { path = "../../../../crates/proto" }
lcc-db = { path = "../../../../crates/db" }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = "9"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util", "macros"] }
axum = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
jsonwebtoken = { workspace = true }

# See api-gateway/Cargo.toml: orphaned contract test, never compiled by cargo.
[[test]]
name = "identity_flow_test"
path = "../../../../tests/contract/canonical/identity_flow_test.rs"

[lints]
workspace = true
