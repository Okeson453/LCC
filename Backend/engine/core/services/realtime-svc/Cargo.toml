[package]
name = "lcc-realtime-svc"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Proprietary"
# F-AUDIT-85: proprietary monorepo, never published; see [workspace.package].
publish = false

[[bin]]
name = "lcc-realtime-svc"
path = "src/main.rs"

[lib]
name = "lcc_realtime_svc"
path = "src/lib.rs"

[dependencies]
lcc-error = { path = "../../../../crates/error" }
lcc-config = { path = "../../../../crates/config" }
lcc-observability = { path = "../../../../crates/observability" }
lcc-auth = { path = "../../../../crates/auth" }
lcc-audit-client = { path = "../../../../crates/audit-client" }
lcc-events = { path = "../../../../crates/events" }
lcc-db = { path = "../../../../crates/db" }

axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
deadpool-redis = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# See api-gateway/Cargo.toml: this contract test was never referenced by any
# `[[test]]` target, so it was dead weight that cargo silently skipped.
[[test]]
name = "realtime_flow_test"
path = "../../../../tests/contract/canonical/realtime_flow_test.rs"

# Asserts realtime-svc's Channel::allowed_events and route_event against
# Contract/realtime/lcc-realtime-contract.yaml.
[[test]]
name = "realtime_contract_conformance"
path = "../../../../tests/contract/realtime_contract_conformance.rs"

[lints]
workspace = true
