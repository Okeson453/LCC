[project]
name = "lcc-engine-intelligence"
version = "0.1.0"
description = "OKESON-LCC Python Intelligence Engine"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "grpcio>=1.67.0",
    "grpcio-tools>=1.67.0",
    "protobuf>=5.28.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "qdrant-client>=1.12.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "sentence-transformers>=3.2.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "hvac>=2.3.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
    "intelligence-common",
    "compliance-types",
    "llm-client",
    "kb-client",
    "vector-db",
    "event-bus",
    "lcc-proto",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
# F-AUDIT-72: `package = true` makes uv build and install this project, which
# invokes setuptools auto-discovery. The intelligence services are *applications*
# — each is launched with uvicorn or baked into its own Dockerfile from
# `services/<name>/src/` — not a library, so there is nothing coherent for
# setuptools to discover as a single distribution. The build failed outright:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#   ['proto', 'infra', 'config', 'crates', 'engine', 'schemas', 'packages',
#    'observability']
#   setuptools will not proceed with this build.
#
# `package = false` declares the project virtual: uv still resolves and installs
# the dependency set, and still runs pytest/ruff against the source, but does
# not attempt to build a wheel that is never consumed.
package = false

[tool.pytest.ini_options]
addopts = "-v --strict-markers --asyncio-mode=auto"
testpaths = ["tests", "services"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests (require external services)",
    "contract: contract tests",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/proto/gen/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "A", "C90"]
ignore = ["S101", "S104", "D100", "D101", "D102", "D103"]
unfixable = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D", "S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# F-AUDIT-81: these seven packages live in this repository under
# `Backend/packages/`, not on PyPI. Nothing mapped them to a local path, so
# uv went to the registry and the resolution failed outright:
#
#   error: No solution found when resolving dependencies
#     cause: Because compliance-types was not found in the package registry
#            and your project depends on compliance-types, ...
#
# The Python Intelligence Engine cannot be installed or tested at all. Each
# name is now bound to its in-repo path, which is what makes the intelligence
# tier self-contained and offline-resolvable against the monorepo.
[tool.uv.sources]
compliance-types = { path = "../../packages/compliance-types" }
event-bus = { path = "../../packages/event-bus" }
intelligence-common = { path = "../../packages/intelligence-common" }
kb-client = { path = "../../packages/kb-client" }
llm-client = { path = "../../packages/llm-client" }
lcc-proto = { path = "../../packages/proto" }
vector-db = { path = "../../packages/vector-db" }
