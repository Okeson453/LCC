[project]
name = "enrichment-worker"
version = "0.1.0"
description = "Third-party data broker: enriches contacts/jobs/posts"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "intelligence-common",
    "kb-client",
    "vector-db",
    "event-bus",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
