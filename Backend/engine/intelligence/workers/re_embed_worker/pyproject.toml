[project]
name = "re-embed-worker"
version = "0.1.0"
description = "Periodic re-embedding job for KB records"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "intelligence-common",
    "kb-client",
    "vector-db",
    "event-bus",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
