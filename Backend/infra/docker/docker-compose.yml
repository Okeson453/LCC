  approval-svc:
    image: registry.lcc.local/lcc/approval-svc:0.1.0
    environment: { <<: *common-env }
    ports:
      - "18089:8089"
    depends_on: [postgres, redis]

  identity-svc:
    image: registry.lcc.local/lcc/identity-svc:0.1.0
    environment: { <<: *common-env }
    ports:
      - "18591:8090"
    depends_on: [postgres]

  orchestrator:
    image: registry.lcc.local/lcc/orchestrator:0.1.0
    environment: { <<: *common-env }
    ports:
      - "18585:8081"
    depends_on: [redis]

  briefing-worker:
    image: registry.lcc.local/lcc/briefing-worker:0.1.0
    environment: { <<: *common-env }
    depends_on: [postgres, redis]

  sequence-step-scheduler:
    image: registry.lcc.local/lcc/sequence-step-scheduler:0.1.0
    environment: { <<: *common-env }
    depends_on: [postgres, redis]

  opportunity-discovery-worker:
    image: registry.lcc.local/lcc/opportunity-discovery-worker:0.1.0
