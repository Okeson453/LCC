  data-purge-worker:
    image: registry.lcc.local/lcc/data-purge-worker:0.1.0
    environment: { <<: *common-env }
    depends_on: [postgres]

  audit-integrity-worker:
    image: registry.lcc.local/lcc/audit-integrity-worker:0.1.0
    environment: { <<: *common-env }
