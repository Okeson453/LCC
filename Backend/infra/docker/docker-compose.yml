  enrichment-worker:
    image: registry.lcc.local/lcc/enrichment-worker:0.1.0
    environment: { <<: *common-env }
    depends_on: [redis]

  re-embed-worker:
    image: registry.lcc.local/lcc/re-embed-worker:0.1.0
