---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-svc
  namespace: lcc-engine
  labels:
    app: profile-svc
    app.kubernetes.io/part-of: lcc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-svc
  template:
    metadata:
      labels:
        app: profile-svc
        app.kubernetes.io/part-of: lcc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: profile-svc
          image: registry.lcc.local/lcc/profile-svc:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVICE_NAME
              value: profile-svc
            - name: HTTP_PORT
              value: "8082"
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: profile-svc
  namespace: lcc-engine
spec:
  selector:
    app: profile-svc
  ports:
    - port: 8082
      targetPort: http
      name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: profile-svc
  namespace: lcc-engine
automountServiceAccountToken: false
