apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: linkedin-credentials
  namespace: lcc-engine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: linkedin-credentials
  data:
    - secretKey: client_id
      remoteRef:
        key: lcc/linkedin/client_id
    - secretKey: client_secret
      remoteRef:
        key: lcc/linkedin/client_secret
