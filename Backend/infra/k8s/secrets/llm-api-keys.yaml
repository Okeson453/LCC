apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-api-keys
  namespace: lcc-intelligence
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: llm-api-keys
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: lcc/llm/openai
    - secretKey: anthropic_api_key
      remoteRef:
        key: lcc/llm/anthropic
