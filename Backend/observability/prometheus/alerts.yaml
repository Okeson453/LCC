groups:
  - name: lcc-slos
    interval: 30s
    rules:
      - alert: GovernorP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(lcc_governor_evaluate_duration_seconds_bucket[5m]))) > 0.2
        for: 5m
        labels:
          severity: warning
          slo: governor-p99
        annotations:
          summary: Compliance Governor p99 > 200ms

      - alert: ApiGatewayP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(lcc_http_request_duration_seconds_bucket{svc="api-gateway",route!~"/healthz|/readyz"}[5m]))) > 0.3
        for: 5m
        labels:
          severity: warning
          slo: api-gateway-p99
        annotations:
          summary: API Gateway p99 > 300ms

      - alert: PermitTokenP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(lcc_permit_token_verify_duration_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
          slo: permit-token-p99
        annotations:
          summary: Permit-token verify p99 > 50ms

      - alert: ApiAvailabilityLow
        expr: avg_over_time(lcc_http_request_total{code!~"5.."}[5m]) / avg_over_time(lcc_http_request_total[5m]) < 0.995
        for: 10m
        labels:
          severity: critical
          slo: api-availability
        annotations:
          summary: API availability < 99.5%

      - alert: RestrictionEventSpike
        expr: sum by (member_id) (rate(lcc_restriction_detected_total[5m])) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Restriction event spike for member

      - alert: CircuitBreakerOpen
        expr: sum by (provider, endpoint) (lcc_circuit_breaker_state{state="open"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Circuit breaker open for upstream
