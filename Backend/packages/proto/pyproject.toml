[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcc-proto"
version = "0.1.0"
description = "Generated Python gRPC stubs from proto/"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "grpcio>=1.67.0",
    "grpcio-tools>=1.67.0",
    "protobuf>=5.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lcc_pb2", "src/lcc/v1/common", "src/lcc/v1/compliance", "src/lcc/v1/integration", "src/lcc/v1/intelligence", "src/lcc/v1/profile", "src/lcc/v1/content", "src/lcc/v1/engagement", "src/lcc/v1/network", "src/lcc/v1/outreach", "src/lcc/v1/analytics", "src/lcc/v1/approval", "src/lcc/v1/identity", "src/lcc/v1/events"]
