[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligence-common"
version = "0.1.0"
description = "OKESON-LCC Python Intelligence Engine — shared utilities"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "hvac>=2.3.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_common"]
