[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-client"
version = "0.1.0"
description = "KB repository wrapper — asyncpg + vector retriever"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "intelligence-common",
    "vector-db",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kb_client"]
