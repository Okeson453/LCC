syntax = "proto3";
package lcc.v1.analytics;

import "google/protobuf/timestamp.proto";
import "lcc/v1/common/trace.proto";

enum FunnelKind {
  FUNNEL_UNSPECIFIED = 0;
  FUNNEL_JOB = 1;
  FUNNEL_CLIENT = 2;
}

message ContentMetrics {
  string content_item_id = 1;
  uint64 impressions = 2;
  uint64 reactions = 3;
  uint64 comments = 4;
  uint64 reposts = 5;
  double engagement_rate = 6;
  uint32 days_since_published = 7;
}

message ProfileMetrics {
  uint64 profile_views_30d = 1;
  uint64 search_appearances_30d = 2;
  double strength_score_trajectory = 3;       // delta from previous snapshot
}

message NetworkMetrics {
  uint32 connections_growth_30d = 1;
  double acceptance_rate_30d = 2;
  uint32 vip_stale_count = 3;
  uint32 standard_stale_count = 4;
  uint32 peer_stale_count = 5;
}

message OutreachMetrics {
  uint32 messages_sent_30d = 1;
  double reply_rate_30d = 2;
  uint32 meetings_booked_30d = 3;
  double active_sequence_count = 4;
}

message FunnelStageCount {
  string stage = 1;
  uint32 count = 2;
}

message FunnelReport {
  FunnelKind kind = 1;
  repeated FunnelStageCount stages = 2;
  double conversion_rate_top_to_bottom = 3;
}

message AccountHealthReport {
  string member_id = 1;
  double h_c = 2;
  uint32 warmup_days_remaining = 3;
  string active_compliance_config_version = 4;
  uint32 connections_used_today = 5;
  uint32 connections_cap_today = 6;
  uint32 dms_used_today = 7;
  uint32 dms_cap_today = 8;
  bool is_restricted = 9;
  google.protobuf.Timestamp report_at = 10;
}

message Digest {
  string period = 1;                  // "weekly"|"monthly"
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  repeated string highlights = 4;
  repeated string suggestions = 5;
  string body_markdown = 6;
}

message Request {
  string member_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  lcc.v1.common.TraceContext trace = 4;
}

message Response {
  oneof body {
    ContentMetrics content = 1;
    ProfileMetrics profile = 2;
    NetworkMetrics network = 3;
    OutreachMetrics outreach = 4;
    FunnelReport funnel = 5;
    AccountHealthReport account_health = 6;
    Digest digest = 7;
  }
}

service AnalyticsSvc {
  rpc GetContentMetrics(Request) returns (Response);
  rpc GetProfileMetrics(Request) returns (Response);
  rpc GetNetworkMetrics(Request) returns (Response);
  rpc GetOutreachMetrics(Request) returns (Response);
  rpc GetFunnel(Request) returns (Response);
  rpc GetAccountHealthReport(Request) returns (Response);
  rpc GetDigest(Request) returns (Response);
}
