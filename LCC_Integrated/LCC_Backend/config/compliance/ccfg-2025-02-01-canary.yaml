# ccfg-2025-02-01-canary — canary config (per-member pilot only).

version: ccfg-2025-02-01-canary
status: canary
parent_version: ccfg-2025-01-15-rc2
applies_to:
  - role: pilot_member
    max_members: 25

h_c:
  weights:
    response_rate: 0.30
    acceptance_rate: 0.20
    error_rate_inverted: 0.20
    restriction_inverted: 0.15
    engagement_quality: 0.15
  warmup_threshold: 0.92
  standard_threshold: 0.72
  reserve_fraction: 0.20

ab_d:
  multiplier_floor: 0.3
  multiplier_ceiling: 1.5

rho:
  labeled_send_threshold: 200
  vip_boost: 1.5

phi:
  qualified_threshold: 0.75

daily_caps:
  connection_request: 15
  dm: 25
  post_publish: 2
  sequence_step_send: 10
  job_application_submit: 5
  client_proposal_send: 2
  executive_outreach: 2

cooldowns:
  connection_request_min_days_between_to_same_target: 180
  dm_min_hours_between_to_same_target: 72

session_pacing:
  rolling_window_seconds: 1200
  max_actions_in_window: 3

grounding:
  min_kb_refs_required: 2
  low_grounding_blocks_publish: true
