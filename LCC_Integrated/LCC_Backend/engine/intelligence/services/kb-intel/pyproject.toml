[project]
name = "kb-intel"
version = "0.1.0"
description = "OKESON-LCC Knowledge Base Intelligence"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "intelligence-common",
    "kb-client",
    "vector-db",
    "lcc-proto",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_intel"]
