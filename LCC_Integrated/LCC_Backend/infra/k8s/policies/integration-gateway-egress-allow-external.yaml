apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: integration-gateway-egress-allow-external
  namespace: lcc-engine
spec:
  podSelector:
    matchLabels:
      app: integration-gateway
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - port: 443
          protocol: TCP
