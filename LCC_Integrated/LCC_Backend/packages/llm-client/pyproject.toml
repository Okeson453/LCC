[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-client"
version = "0.1.0"
description = "LLM provider abstraction (OpenAI, Anthropic) with cost controller"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "intelligence-common",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_client"]
