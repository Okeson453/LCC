[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vector-db"
version = "0.1.0"
description = "Vector DB abstraction (Qdrant + Pinecone)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9.0",
    "qdrant-client>=1.12.0",
    "pinecone-client>=5.0.0",
    "structlog>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_db"]
