[project]
name = "lcc"
version = "0.1.0"
description = "OKESON-LCC Python Intelligence Engine"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "OKESON-LCC Engineering" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "grpcio>=1.67.0",
    "grpcio-tools>=1.67.0",
    "protobuf>=5.28.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "qdrant-client>=1.12.0",
    "pinecone-client>=5.0.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "sentence-transformers>=3.2.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-openai>=0.2.0",
    "hvac>=2.3.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis",
    "types-aiofiles",
    "freezegun>=1.5.0",
]

[tool.uv]
# uv workspace member definition
package = true
dev-dependencies = []

# Enforce boundary: Python cannot resolve Rust crates (impossible by packaging model),
# and Python shall not import the LinkedIn API directly.
[tool.uv.sources]
# No git or other sources - all dependencies from PyPI/private index only.

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --strict-markers --tb=short --asyncio-mode=auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests (require external services)",
    "contract: contract tests",
    "compliance_sim: account-safety simulation",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["engine/intelligence", "packages"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/proto/gen/**", "**/__pycache__"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "S",  # flake8-bandit (security)
    "A",  # flake8-builtins
    "C90", # mccabe complexity
    "D",  # pydocstyle
    "RUF", # ruff-specific
]
ignore = [
    "D100", "D101", "D102", "D103",  # missing docstrings: tests/short scripts
    "S101",  # Use of assert detected (OK in tests)
    "S104",  # Binding to all interfaces (OK for dev servers)
]
unfixable = ["B008"]  # prevent removing function calls in defaults

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D", "S", "B"]
"**/__main__.py" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
exclude = [
    "**/proto/gen/**",
    "**/tests/compliance-sim/**",
    "**/__pycache__/**",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
