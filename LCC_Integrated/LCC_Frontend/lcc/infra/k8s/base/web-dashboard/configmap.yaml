apiVersion: v1
kind: ConfigMap
metadata:
  name: web-dashboard-config
  namespace: lcc
data:
  NODE_ENV: production
  PORT: "3000"
  NEXT_TELEMETRY_DISABLED: "1"
  PUBLIC_TRACE_HEADER: x-trace-id
  NEXT_PUBLIC_API_BASE: https://api.lcc.example
  NEXT_PUBLIC_SUPPORTED_LOCALES: en,es,de,fr
  NEXT_PUBLIC_DEFAULT_LOCALE: en
