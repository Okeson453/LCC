apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web-dashboard-secrets
  namespace: lcc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lcc-secret-store
  target:
    name: web-dashboard-secrets
    creationPolicy: Owner
  data:
    - secretKey: LINKEDIN_CLIENT_ID
      remoteRef: { key: linkedin-manager, property: client-id }
    - secretKey: LINKEDIN_CLIENT_SECRET
      remoteRef: { key: linkedin-manager, property: client-secret }
