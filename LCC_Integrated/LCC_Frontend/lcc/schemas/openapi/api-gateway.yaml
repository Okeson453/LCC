components:
  schemas:
    Member:
      type: object
      required: [id, email, display_name, goal_mode, timezone, oauth_expires_at, is_restricted]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        goal_mode:
          type: string
          enum: [job_hunting, client_acquisition, hybrid]
        timezone: { type: string }
        oauth_expires_at: { type: string, format: date-time }
        is_restricted: { type: boolean }
        created_at: { type: string, format: date-time }
    MemberUpdate:
      type: object
      properties:
        display_name: { type: string }
        avatar_url: { type: string, format: uri }
        timezone: { type: string }
    MemberSettings:
      type: object
      properties:
        goal_mode:
          type: string
          enum: [job_hunting, client_acquisition, hybrid]
        notifications_enabled: { type: boolean }
        quiet_hours_start: { type: string, nullable: true }
        quiet_hours_end: { type: string, nullable: true }
        theme: { type: string, enum: [light, dark, system, high_contrast] }
    MemberSettingsUpdate:
      type: object
      properties:
        goal_mode: { type: string, enum: [job_hunting, client_acquisition, hybrid] }
        notifications_enabled: { type: boolean }
        quiet_hours_start: { type: string }
        quiet_hours_end: { type: string }
        theme: { type: string, enum: [light, dark, system, high_contrast] }
    TokenPair:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
    Briefing:
      type: object
      properties:
        date: { type: string, format: date }
        sections:
          type: array
          items: { $ref: '#/components/schemas/BriefingSection' }
        generated_at: { type: string, format: date-time }
    BriefingSection:
      type: object
      required: [kind, title, items]
      properties:
        kind:
          type: string
          enum: [approvals_due, hot_opportunities, engagement, followups, content_suggestions]
        title: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/BriefingItem' }
    BriefingItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        summary: { type: string }
        action_url: { type: string, format: uri }
        tier:
          type: integer
          minimum: 1
          maximum: 5
    Approval:
      type: object
      required: [id, member_id, action_type, tier, status, payload, kb_refs, trace_id, created_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        action_type:
          type: string
          enum: [publish_post, send_connection, send_dm, send_message, apply_opportunity, send_proposal, edit_profile, comment, like]
        tier:
          type: integer
          minimum: 1
          maximum: 5
        status:
          type: string
          enum: [pending, approved, rejected, expired, failed]
        payload: { type: object, additionalProperties: true }
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
        governance:
          type: object
          nullable: true
          properties:
            permit: { type: boolean }
            failed_guard: { type: string }
            reason: { type: string }
        trace_id: { type: string }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        edited_payload: { type: object, additionalProperties: true }
        comment: { type: string }
    GuardFailure:
      type: object
      required: [guard, reason]
      properties:
        guard: { type: string }
        reason: { type: string }
        trace_id: { type: string }
    KbCitation:
      type: object
      required: [record_id, title, category]
      properties:
        record_id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        excerpt: { type: string }
        url: { type: string, format: uri, nullable: true }
    ProfileSnapshot:
      type: object
      required: [id, member_id, captured_at, strength, components]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        captured_at: { type: string, format: date-time }
        strength:
          type: integer
          minimum: 0
          maximum: 100
        components:
          type: object
          properties:
            headline: { type: integer, minimum: 0, maximum: 100 }
            about: { type: integer, minimum: 0, maximum: 100 }
            experience: { type: integer, minimum: 0, maximum: 100 }
            skills: { type: integer, minimum: 0, maximum: 100 }
            network: { type: integer, minimum: 0, maximum: 100 }
    EditDraft:
      type: object
      required: [id, field, current_value, suggested_value, rationale]
      properties:
        id: { type: string, format: uuid }
        field: { type: string }
        current_value: { type: string }
        suggested_value: { type: string }
        rationale: { type: string }
        priority:
          type: integer
          minimum: 1
          maximum: 5
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
    ProfileStrengthPoint:
      type: object
      required: [captured_at, strength]
      properties:
        captured_at: { type: string, format: date-time }
        strength: { type: integer, minimum: 0, maximum: 100 }
        delta: { type: integer }
    JobRef:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
    ContentItem:
      type: object
      required: [id, member_id, status, body, created_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, pending_approval, scheduled, publishing, published, rejected]
        body: { type: string }
        title: { type: string, nullable: true }
        media: { type: array, items: { $ref: '#/components/schemas/MediaItem' } }
        variant: { type: string, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        trace_id: { type: string }
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaItem:
      type: object
      required: [id, kind, url]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, video, document] }
        url: { type: string, format: uri }
        alt: { type: string, nullable: true }
    ContentCreate:
      type: object
      required: [body]
      properties:
        body: { type: string }
        title: { type: string }
        variant: { type: string }
        media_ids:
          type: array
          items: { type: string, format: uuid }
    ContentUpdate:
      type: object
      properties:
        body: { type: string }
        title: { type: string }
        media_ids:
          type: array
          items: { type: string, format: uuid }
    ContentVariant:
      type: object
      required: [variant, body]
      properties:
        variant: { type: string, enum: [authority, contrarian, bts, case_study] }
        body: { type: string }
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
    ComposeRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        variants:
          type: array
          items: { type: string, enum: [authority, contrarian, bts, case_study] }
        pillar_id: { type: string, format: uuid, nullable: true }
    QualityReport:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        flags:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [fluff, tone, banned_phrase, length, unsupported_claim, low_grounding] }
              severity: { type: string, enum: [info, warn, error] }
              span: { type: string }
              message: { type: string }
        kb_coverage: { type: number, minimum: 0, maximum: 1 }
    CalendarEntry:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentItem' }
    InboxItem:
      type: object
      required: [id, kind, actor, snippet, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [dm, comment, connection_request, mention, reaction] }
        actor:
          type: object
          properties:
            id: { type: string }
            display_name: { type: string }
            avatar_url: { type: string, format: uri, nullable: true }
        snippet: { type: string }
        priority:
          type: string
          enum: [low, normal, high, urgent]
        created_at: { type: string, format: date-time }
        unread: { type: boolean }
    QueueItem:
      type: object
      required: [id, kind, actor, body, priority, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [comment_target, congratulation_target, followup_target] }
        actor:
          type: object
          properties:
            id: { type: string }
            display_name: { type: string }
            avatar_url: { type: string, format: uri, nullable: true }
        body: { type: string }
        priority: { type: string, enum: [low, normal, high] }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
    ReplyVariant:
      type: object
      required: [tone, body]
      properties:
        tone: { type: string, enum: [warm, professional, brief, assertive] }
        body: { type: string }
    ReplyDecision:
      type: object
      required: [variant_index, body]
      properties:
        variant_index: { type: integer }
        body: { type: string }
    Contact:
      type: object
      required: [id, member_id, display_name, stage, created_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: string, format: uri, nullable: true }
        headline: { type: string }
        company:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        stage:
          type: string
          enum: [cold, connected, engaged, conversation, opportunity, closed]
        tags:
          type: array
          items: { type: string }
        last_interaction_at: { type: string, format: date-time, nullable: true }
        warmth_score: { type: number, minimum: 0, maximum: 1 }
        created_at: { type: string, format: date-time }
    ContactUpdate:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }
        stage: { type: string, enum: [cold, connected, engaged, conversation, opportunity, closed] }
        notes: { type: string }
    Interaction:
      type: object
      required: [id, kind, occurred_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [dm, comment, email, meeting, intro, like, connection] }
        body: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        direction: { type: string, enum: [inbound, outbound] }
    InteractionCreate:
      type: object
      required: [kind, occurred_at]
      properties:
        kind: { type: string }
        body: { type: string }
        occurred_at: { type: string, format: date-time }
        direction: { type: string, enum: [inbound, outbound] }
    Sequence:
      type: object
      required: [id, member_id, name, status, step_count, created_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [draft, active, paused, completed, archived]
        step_count: { type: integer }
        enrolled_count: { type: integer }
        reply_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SequenceCreate:
      type: object
      required: [name, contact_ids, template_id]
      properties:
        name: { type: string }
        contact_ids:
          type: array
          items: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
    SequenceDetail:
      allOf:
        - $ref: '#/components/schemas/Sequence'
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/SequenceStep' }
            enrolled_contacts:
              type: array
              items: { $ref: '#/components/schemas/Contact' }
    SequenceStep:
      type: object
      required: [id, day_offset, body, status]
      properties:
        id: { type: string, format: uuid }
        day_offset: { type: integer }
        body: { type: string }
        status:
          type: string
          enum: [draft, pending_approval, approved, sent, paused]
        scheduled_at: { type: string, format: date-time, nullable: true }
        trace_id: { type: string }
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
    SequenceTemplate:
      type: object
      required: [id, name, persona, step_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        persona: { type: string }
        step_count: { type: integer }
        body_preview: { type: string }
    Opportunity:
      type: object
      required: [id, member_id, title, status, fit_score, captured_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        title: { type: string }
        kind:
          type: string
          enum: [job, client_lead]
        company: { type: string }
        url: { type: string, format: uri, nullable: true }
        status:
          type: string
          enum: [discovered, qualified, drafting, applied, interviewing, offer, won, lost, parked]
        fit_score:
          type: number
          minimum: 0
          maximum: 1
        fit_breakdown:
          type: object
          properties:
            skills: { type: number }
            seniority: { type: number }
            domain: { type: number }
            location: { type: number }
            comp: { type: number }
            culture: { type: number }
        action_plan:
          type: string
          enum: [apply_now, engage_then_message, warm_intro, watchlist, archive]
        captured_at: { type: string, format: date-time }
    OpportunityDetail:
      allOf:
        - $ref: '#/components/schemas/Opportunity'
        - type: object
          properties:
            description: { type: string }
            requirements:
              type: array
              items: { type: string }
            posted_at: { type: string, format: date-time }
            hidden_signals:
              type: array
              items: { type: string }
    ApplicationDraft:
      type: object
      required: [id, body]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        attachments:
          type: array
          items: { type: string }
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
    ProposalDraft:
      type: object
      required: [id, body]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        fee_estimate: { type: string, nullable: true }
        timeline: { type: string, nullable: true }
        kb_refs:
          type: array
          items: { $ref: '#/components/schemas/KbCitation' }
    ContentAnalytics:
      type: object
      properties:
        impressions:
          type: integer
        engagements:
          type: integer
        followers_delta:
          type: integer
        by_pillar:
          type: array
          items:
            type: object
            properties:
              pillar: { type: string }
              impressions: { type: integer }
              engagements: { type: integer }
        time_series:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              impressions: { type: integer }
              engagements: { type: integer }
    ProfileAnalytics:
      type: object
      properties:
        profile_views:
          type: integer
        search_appearances:
          type: integer
        connection_requests_received:
          type: integer
        time_series:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              views: { type: integer }
              searches: { type: integer }
    NetworkAnalytics:
      type: object
      properties:
        total_connections:
          type: integer
        growth_30d:
          type: integer
        warm_intro_count:
          type: integer
        stage_breakdown:
          type: object
          additionalProperties:
            type: integer
    OutreachAnalytics:
      type: object
      properties:
        sent_30d:
          type: integer
        reply_rate:
          type: number
        meeting_rate:
          type: number
        time_series:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              sent: { type: integer }
              replies: { type: integer }
    FunnelAnalytics:
      type: object
      properties:
        stages:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              count: { type: integer }
              conversion_rate: { type: number }
        period: { type: string, enum: [7d, 30d, 90d] }
    AccountHealth:
      type: object
      required: [score, components, computed_at]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
        components:
          type: object
          properties:
            quota_remaining:
              type: number
            grounding_score:
              type: number
