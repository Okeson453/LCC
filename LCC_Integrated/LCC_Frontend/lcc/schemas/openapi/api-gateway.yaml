openapi: 3.1.0
info:
  title: OKESON-LCC API Gateway
  version: 1.0.0
  description: |
    HTTP API surface that the frontend consumes. The backend's API Gateway
    enforces JWT validation, RLS, RBAC, and traces every request with a
    trace_id and (for mutations) an Idempotency-Key.
  contact:
    name: OKESON Backend Team
    email: backend@okeson.example
  license:
    name: Proprietary
servers:
  - url: https://api.lcc.okeson.example
    description: Production
  - url: https://api.staging.lcc.okeson.example
    description: Staging
  - url: http://localhost:8080
    description: Local dev
tags:
  - name: auth
  - name: members
  - name: profile
  - name: content
  - name: engagement
  - name: network
  - name: outreach
  - name: opportunity
  - name: analytics
  - name: approvals
  - name: admin
  - name: kb
  - name: briefing
paths:
  /auth/linkedin/start:
    get:
      tags: [auth]
      operationId: startLinkedInOAuth
      summary: Begin LinkedIn OAuth handshake
      responses:
        '302':
          description: Redirect to LinkedIn
          headers:
            Location:
              schema: { type: string, format: uri }
  /auth/linkedin/callback:
    get:
      tags: [auth]
      operationId: linkedInOAuthCallback
      summary: Complete LinkedIn OAuth handshake
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to /onboarding or /today
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      responses:
        '200':
          description: New short-lived JWT issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Logged out }
  /members/me:
    get:
      tags: [members]
      operationId: getCurrentMember
      responses:
        '200':
          description: Current member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
    patch:
      tags: [members]
      operationId: updateCurrentMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
    delete:
      tags: [members]
      operationId: deleteMember
      responses:
        '204': { description: Deleted }
  /members/me/settings:
    get:
      tags: [members]
      operationId: getMemberSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSettings' }
    patch:
      tags: [members]
      operationId: updateMemberSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberSettingsUpdate' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSettings' }
  /members/{id}/briefing/today:
    get:
      tags: [briefing]
      operationId: getTodaysBriefing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Today's briefing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Briefing' }
  /members/{id}/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, decided, expired]
        - in: query
          name: tier
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
  /members/{id}/approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: approvalId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
  /members/{id}/approvals/{approvalId}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: approvalId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '422':
          description: Compliance Governor denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardFailure' }
  /members/{id}/profile/snapshots/latest:
    get:
      tags: [profile]
      operationId: getLatestProfileSnapshot
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest profile snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSnapshot' }
  /members/{id}/profile/audit:
    post:
      tags: [profile]
      operationId: runProfileAudit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Audit job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /members/{id}/profile/edit-drafts:
    post:
      tags: [profile]
      operationId: generateEditDrafts
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Generated drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EditDraft' }
  /members/{id}/profile/strength-history:
    get:
      tags: [profile]
      operationId: getProfileStrengthHistory
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 30d, 90d, 365d]
      responses:
        '200':
          description: Strength history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfileStrengthPoint' }
  /members/{id}/content:
    get:
      tags: [content]
      operationId: listContent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, pending_approval, scheduled, publishing, published, rejected]
      responses:
        '200':
          description: Content items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentItem' }
    post:
      tags: [content]
      operationId: createContent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /members/{id}/content/compose:
    post:
      tags: [content]
      operationId: composeContent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComposeRequest' }
      responses:
        '200':
          description: Composed variants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentVariant' }
  /members/{id}/content/{contentId}:
    get:
      tags: [content]
      operationId: getContentItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Content item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
    patch:
      tags: [content]
      operationId: updateContentItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentUpdate' }
      responses:
        '200':
          description: Updated content item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
    delete:
      tags: [content]
      operationId: deleteContentItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
  /members/{id}/content/{contentId}/quality-check:
    post:
      tags: [content]
      operationId: runContentQualityCheck
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Quality report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityReport' }
  /members/{id}/content/{contentId}/submit-for-approval:
    post:
      tags: [content]
      operationId: submitContentForApproval
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /members/{id}/content/{contentId}/schedule:
    post:
      tags: [content]
      operationId: scheduleContent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at: { type: string, format: date-time }
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /members/{id}/content/calendar:
    get:
      tags: [content]
      operationId: getContentCalendar
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarEntry' }
  /members/{id}/engagement/inbox:
    get:
      tags: [engagement]
      operationId: getEngagementInbox
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Inbox items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboxItem' }
  /members/{id}/engagement/queue:
    get:
      tags: [engagement]
      operationId: getEngagementQueue
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Engagement queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueItem' }
  /members/{id}/engagement/tasks/{taskId}/draft-reply:
    post:
      tags: [engagement]
      operationId: draftEngagementReply
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reply variants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReplyVariant' }
  /members/{id}/engagement/tasks/{taskId}/approve:
    post:
      tags: [engagement]
      operationId: approveEngagementTask
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: taskId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplyDecision' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
  /members/{id}/contacts:
    get:
      tags: [network]
      operationId: listContacts
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: stage
          schema:
            type: string
            enum: [cold, connected, engaged, conversation, opportunity, closed]
        - in: query
          name: expand
          schema: { type: string, enum: [company] }
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
  /members/{id}/contacts/stale:
    get:
      tags: [network]
      operationId: getStaleContacts
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stale contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
  /members/{id}/contacts/{contactId}:
    get:
      tags: [network]
      operationId: getContact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contactId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
    patch:
      tags: [network]
      operationId: updateContact
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contactId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
  /members/{id}/contacts/{contactId}/interactions:
    get:
      tags: [network]
      operationId: listContactInteractions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contactId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Interactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Interaction' }
    post:
      tags: [network]
      operationId: logInteraction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contactId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionCreate' }
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interaction' }
  /members/{id}/sequences:
    get:
      tags: [outreach]
      operationId: listSequences
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sequences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sequence' }
    post:
      tags: [outreach]
      operationId: createSequence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SequenceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sequence' }
  /members/{id}/sequences/{sequenceId}:
    get:
      tags: [outreach]
      operationId: getSequence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: sequenceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sequence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SequenceDetail' }
  /members/{id}/sequences/{sequenceId}/steps/{stepId}/approve:
    post:
      tags: [outreach]
      operationId: approveSequenceStep
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: sequenceId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: stepId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                edited_body: { type: string }
      responses:
        '200':
          description: Step updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SequenceStep' }
  /members/{id}/sequences/{sequenceId}/pause:
    post:
      tags: [outreach]
      operationId: pauseSequence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: sequenceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sequence' }
  /members/{id}/sequences/templates:
    get:
      tags: [outreach]
      operationId: listSequenceTemplates
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SequenceTemplate' }
  /members/{id}/opportunities:
    get:
      tags: [opportunity]
      operationId: listOpportunities
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Opportunity' }
  /members/{id}/opportunities/discover:
    post:
      tags: [opportunity]
      operationId: runOpportunityDiscovery
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Discovery job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
  /members/{id}/opportunities/{opportunityId}:
    get:
      tags: [opportunity]
      operationId: getOpportunity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: opportunityId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Opportunity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityDetail' }
  /members/{id}/opportunities/{opportunityId}/draft-application:
    post:
      tags: [opportunity]
      operationId: draftOpportunityApplication
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: opportunityId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Application draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationDraft' }
  /members/{id}/opportunities/{opportunityId}/draft-proposal:
    post:
      tags: [opportunity]
      operationId: draftOpportunityProposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: opportunityId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Proposal draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalDraft' }
  /members/{id}/analytics/content:
    get:
      tags: [analytics]
      operationId: getContentAnalytics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Content analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentAnalytics' }
  /members/{id}/analytics/profile:
    get:
      tags: [analytics]
      operationId: getProfileAnalytics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Profile analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileAnalytics' }
  /members/{id}/analytics/network:
    get:
      tags: [analytics]
      operationId: getNetworkAnalytics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Network analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAnalytics' }
  /members/{id}/analytics/outreach:
    get:
      tags: [analytics]
      operationId: getOutreachAnalytics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Outreach analytics
          content:
            application/json:
