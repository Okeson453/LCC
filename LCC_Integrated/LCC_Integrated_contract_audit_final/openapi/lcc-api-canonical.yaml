              properties:
                reviewer_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Restriction cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictionState' }

# -----------------------------------------------------------------------------
# COMPONENT PARAMETERS
# -----------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MemberId:
      in: path
      name: memberId
      required: true
      schema: { type: string, format: uuid }
      description: Tenant-scoped member ID (self-only unless role=Admin/Auditor)
    Cursor:
      in: query
      name: cursor
      schema: { type: string, description: 'Opaque cursor for pagination' }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: RBAC denial
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Per-endpoint rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  # ===========================================================================
  # SCHEMAS
  # ===========================================================================
  schemas:

    # ---- Common -------------------------------------------------------------
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok,degraded,unavailable] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok,fail] }
        observed_at: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 'Stable machine-readable error code'
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - VERSION_CONFLICT
                - GOVERNANCE_DENIED
                - GOVERNANCE_DEFERRED
                - RATE_LIMITED
                - VERSION_MISMATCH
                - RESTRICTED_ACCOUNT
                - IDEMPOTENCY_KEY_MISMATCH
                - INTERNAL_ERROR
            message: { type: string }
            details: { type: object, additionalProperties: true }
            trace_id: { type: string, format: uuid }

    GovernanceDeniedError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [GOVERNANCE_DENIED] }
            message: { type: string }
            details:
              type: object
              properties:
                failed_guard: { type: string, enum: [daily_cap,cooldown,duplicate_target,account_health,grounding,restriction_flag,approval_state,session_pacing] }
                reason: { type: string }
                guards_passed:
                  type: array
                  items: { type: string }
            trace_id: { type: string, format: uuid }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, default: Bearer }
        expires_in: { type: integer, description: 'Access-token TTL in seconds' }

    ExportJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued,running,completed,failed] }
        download_url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    JobRef:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued,running,completed,failed] }

    # ---- Members ------------------------------------------------------------
    Member:
      type: object
      required: [id, timezone, active_goal_mode, version]
      properties:
        id: { type: string, format: uuid }
        linkedin_id: { type: string }
        timezone: { type: string }
        active_goal_mode: { type: string, enum: [job_hunting,client_acquisition,hybrid] }
        is_restricted: { type: boolean }
        restricted_since: { type: string, format: date-time, nullable: true }
        warmup_started_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    MemberSettings:
      type: object
      properties:
        timezone: { type: string }
        active_goal_mode: { type: string, enum: [job_hunting,client_acquisition,hybrid] }
        caps_override: { $ref: '#/components/schemas/CapOverrides' }

    MemberSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        timezone: { type: string }
        active_goal_mode: { type: string, enum: [job_hunting,client_acquisition,hybrid] }
        caps_override: { $ref: '#/components/schemas/CapOverrides' }

    CapOverrides:
      type: object
      description: |
        Member-local caps; activating a new value triggers a Compliance
        config version deploy. All values are ceilings, not targets.
      properties:
        connection_per_day: { type: integer, minimum: 0, maximum: 100 }
        dm_per_day:         { type: integer, minimum: 0, maximum: 100 }
        comment_per_day:    { type: integer, minimum: 0, maximum: 100 }
        like_per_day:       { type: integer, minimum: 0, maximum: 100 }
        post_per_day:       { type: integer, minimum: 0, maximum: 10 }

    # ---- Profile ------------------------------------------------------------
    ProfileSnapshot:
      type: object
      required: [member_id, captured_at, strength_score, version]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        captured_at: { type: string, format: date-time }
        headline: { type: string }
        about: { type: string }
        skills: { type: array, items: { type: string } }
        experience:
          type: array
          items: { $ref: '#/components/schemas/ExperienceEntry' }
        strength_score: { type: number, minimum: 0, maximum: 100 }
        goal_mode: { type: string, enum: [job_hunting,client_acquisition,hybrid] }
        raw_cache_ttl_at: { type: string, format: date-time, description: '≤now+24h enforced by data-purge-worker' }
        version: { type: integer }

    ExperienceEntry:
      type: object
      properties:
        title: { type: string }
        company: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date, nullable: true }
        scope: { type: string }

    ProfileStrengthPoint:
      type: object
      properties:
        captured_at: { type: string, format: date-time }
        strength_score: { type: number, minimum: 0, maximum: 100 }

    ProfileAuditJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued,running,completed,failed] }

    ProfileAuditResult:
      type: object
      properties:
        snapshot_id: { type: string, format: uuid }
        strength_score: { type: number, minimum: 0, maximum: 100 }
        findings:
          type: array
          items:
            type: object
            properties:
              field: { type: string, enum: [headline,about,skills,experience,featured] }
              severity: { type: string, enum: [INFO,WARN,HIGH] }
              message: { type: string }
              suggested_fix: { type: string }
        summary: { type: string }

    ProfileEditDraftRequest:
      type: object
      properties:
        target_fields:
          type: array
          items: { type: string, enum: [headline,about,skills,experience] }
        seed: { type: string, description: 'Optional user prompt / context' }

    ProfileEditDraft:
      type: object
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        target_field: { type: string, enum: [headline,about,skills,experience] }
        current_value: { type: string }
        proposed_value: { type: string }
        rationale: { type: string }
        approval_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft,approved,applied,expired] }
        created_at: { type: string, format: date-time }

    # ---- Content ------------------------------------------------------------
    ContentItemStatus:
      type: string
      enum: [idea,drafting,quality_check,pending_approval,approved,rejected,scheduled,publishing,published,publish_failed,blocked,archived]

    ContentItemCreate:
      type: object
      required: [type, pillar]
      properties:
        type: { type: string, enum: [text_post,carousel,poll,video_script,document] }
        pillar: { type: string }
        body: { type: string, description: 'Optional initial body; otherwise drafted via /compose' }
        media_refs:
          type: array
          items: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time, description: 'Optional; if present, sets state to `scheduled` immediately' }

    ContentItemUpdate:
      type: object
      properties:
        body: { type: string }
        pillar: { type: string }
        media_refs:
          type: array
          items: { type: string, format: uuid }
        expected_version: { type: integer, description: 'Optimistic-concurrency token' }

    ContentItem:
      type: object
      required: [id, member_id, type, status, version]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        type: { type: string, enum: [text_post,carousel,poll,video_script,document] }
        pillar: { type: string }
        body: { type: string }
        media_refs:
          type: array
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ContentItemStatus' }
        quality_loop_count: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        metrics_json: { type: object, additionalProperties: true, nullable: true }
        kb_refs:
          type: array
          items: { type: string, format: uuid }
          description: 'Grounding lineage (axiom 5)'
        idempotency_key: { type: string, nullable: true }
        failed_reason: { type: string, nullable: true }
        version: { type: integer }

    ContentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentItem' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    ContentComposeRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        variants: { type: integer, default: 3, minimum: 1, maximum: 5 }
        voice_top_k: { type: integer, default: 3, minimum: 0, maximum: 10 }
        kb_top_k: { type: integer, default: 5, minimum: 1, maximum: 20 }

    ContentVariants:
      type: object
      properties:
        variants:
          type: array
          items:
            type: object
            properties:
              body: { type: string }
              tone: { type: string, enum: [authority,contrarian,behind_the_scenes,case_study] }
              kb_refs:
                type: array
                items: { type: string, format: uuid }
              confidence: { type: number }

    QualityReport:
      type: object
      properties:
        passed: { type: boolean }
        checks:
          type: object
          properties:
            ai_fluff: { type: object, properties: { passed: { type: boolean }; flagged_spans: { type: array, items: { type: string } } } }
            tone: { type: object, properties: { passed: { type: boolean }; score: { type: number } } }
            banned_phrases: { type: object, properties: { passed: { type: boolean }; matches: { type: array, items: { type: string } } } }
            length: { type: object, properties: { passed: { type: boolean }; chars: { type: integer } } }
            grounding: { type: object, properties: { passed: { type: boolean }; kb_ref_count: { type: integer } } }
            grammar: { type: object, properties: { passed: { type: boolean } } }

    ContentScheduleRequest:
      type: object
      required: [scheduled_at]
      properties:
        scheduled_at: { type: string, format: date-time }

    ContentCalendarEntry:
      type: object
      properties:
        date: { type: string, format: date }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentItem' }

    # ---- Engagement ---------------------------------------------------------
    InboxItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [dm,comment,connection_request,mention,reaction] }
        contact_id: { type: string, format: uuid, nullable: true }
        subject: { type: string }
        preview: { type: string }
        received_at: { type: string, format: date-time }
        priority: { type: integer }
        thread_id: { type: string, nullable: true }

    InboxPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    EngagementTask:
      type: object
      required: [id, action_type, status]
      properties:
        id: { type: string, format: uuid }
        action_type: { type: string, enum: [reply,comment,like,congratulate,connection_accept,follow_up] }
        target_post_id: { type: string, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        priority_score: { type: number, nullable: true, description: 'ρ if model fitted, else NULL' }
        status: { type: string, enum: [queued,drafted,approved,sent,dismissed,expired] }
        draft_body: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    ReplyVariants:
      type: object
      properties:
        variants:
          type: array
          items:
            type: object
            properties:
              body: { type: string }
              tone: { type: string }
              confidence: { type: number }
              kb_refs:
                type: array
                items: { type: string, format: uuid }

    EngagementApproveRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve,reject] }
        edited_body: { type: string, description: 'User-edited reply body if any' }
        comment: { type: string, description: 'Optional user comment' }

    # ---- Contacts / CRM ----------------------------------------------------
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        linkedin_url: { type: string, format: uri, nullable: true }
        name: { type: string }
        title: { type: string, nullable: true }
        company_id: { type: string, format: uuid, nullable: true }
        tags:
          type: array
          items: { type: string }
        tier: { type: string, enum: [VIP,standard,peer] }
        connection_status: { type: string, enum: [not_connected,pending,connected] }
        first_contact_date: { type: string, format: date, nullable: true }
        last_interaction_at: { type: string, format: date-time, nullable: true }
        follow_up_date: { type: string, format: date, nullable: true }
        relationship_stage: { type: string, enum: [cold,connected,engaged,conversation,opportunity,closed] }
        health_score: { type: number, nullable: true }
        opportunity_id: { type: string, format: uuid, nullable: true }
        version: { type: integer }

    ContactCreate:
      type: object
      required: [name]
      properties:
        linkedin_url: { type: string, format: uri }
        name: { type: string }
        title: { type: string }
        company_id: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
        tier: { type: string, enum: [VIP,standard,peer], default: standard }
        first_contact_date: { type: string, format: date }

    ContactUpdate:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        tier: { type: string, enum: [VIP,standard,peer] }
        relationship_stage: { type: string, enum: [cold,connected,engaged,conversation,opportunity,closed] }
        follow_up_date: { type: string, format: date }
        notes: { type: string }
        expected_version: { type: integer }

    ContactPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    Interaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        kind: { type: string, enum: [manual_note,inbound_message,sent_message,call,meeting,sequence_step_sent] }
        summary: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    InteractionCreate:
      type: object
      required: [kind, summary, occurred_at]
      properties:
        kind: { type: string, enum: [manual_note,call,meeting] }
        summary: { type: string }
        occurred_at: { type: string, format: date-time }

    # ---- Opportunity --------------------------------------------------------
    OpportunityStatus:
      type: string
      enum: [discovered,qualified,contacted,conversation,applied,proposal_sent,negotiation,won,closed_lost,discarded,dormant]

    Opportunity:
      type: object
      required: [id, type, source, status]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        type: { type: string, enum: [job,client] }
        source: { type: string }
        company_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        fit_score: { type: number, minimum: 0, maximum: 1, nullable: true }
        fit_components:
          type: object
          description: 'φ breakdown: skill, seniority, geo, comp (job) or trigger_recency (client)'
          properties:
            skill: { type: number }
            seniority: { type: number }
            geo: { type: number }
            comp: { type: number }
            trigger_recency: { type: number }
        status: { $ref: '#/components/schemas/OpportunityStatus' }
        discovered_at: { type: string, format: date-time }
        qualified_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        kb_refs:
          type: array
          items: { type: string, format: uuid }
        version: { type: integer }

    OpportunityPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    OpportunityAdvanceRequest:
      type: object
      required: [target_status]
      properties:
        target_status: { $ref: '#/components/schemas/OpportunityStatus' }
        reason: { type: string }

    ApplicationDraft:
      type: object
      properties:
        position: { type: string }
        cover_letter: { type: string }
        submission_payload: { type: object, additionalProperties: true }
        kb_refs:
          type: array
          items: { type: string, format: uuid }

    ApplicationSubmitRequest:
      type: object
      required: [position]
      properties:
        position: { type: string }
        location: { type: string }
        remote: { type: boolean }
        salary_min: { type: number }
        salary_max: { type: number }
        salary_currency: { type: string }
        tech_stack:
          type: array
          items: { type: string }
        requirements: { type: string }
        application_url: { type: string, format: uri }
        contact_person_id: { type: string, format: uuid }
        documents:
          type: array
          items: { type: object }

    ProposalDraft:
      type: object
      properties:
        title: { type: string }
        body_markdown: { type: string }
        one_pager_url: { type: string, format: uri, nullable: true }
        kb_refs:
          type: array
          items: { type: string, format: uuid }

    ProposalSendRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id: { type: string, format: uuid }
        title: { type: string }
        body_markdown: { type: string }
        one_pager_url: { type: string, format: uri }

    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        application_type: { type: string, enum: [job_application,client_proposal,executive_outreach] }
        status: { type: string, enum: [draft,queued,sent,replied,rejected,withdrawn] }
        submitted_at: { type: string, format: date-time, nullable: true }
        response_received_at: { type: string, format: date-time, nullable: true }
        approval_id: { type: string, format: uuid, nullable: true }
        idempotency_key: { type: string, nullable: true }
        version: { type: integer }

    # ---- Sequence / Outreach ------------------------------------------------
    Sequence:
      type: object
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [connection_request,introduction,job_inquiry,client_proposal,engineering_pitch,follow_up,referral,recruiter_response,executive_outreach,thank_you] }
        status: { type: string, enum: [draft,active,paused,completed_engaged,completed_no_reply,abandoned] }
        paused_reason: { type: string, nullable: true }
        current_step: { type: integer }
        last_step_sent_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }

    SequenceCreate:
      type: object
      required: [contact_id, type]
      properties:
        contact_id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        type: { type: string, enum: [connection_request,introduction,job_inquiry,client_proposal,engineering_pitch,follow_up,referral,recruiter_response,executive_outreach,thank_you] }
        template_ids:
          type: array
          items: { type: string, format: uuid }
        cadence_days:
          type: array
          items: { type: integer }
          description: 'Default [0, 2, 5, 10] for §3.6 cadence'

    SequenceDetail:
      allOf:
        - $ref: '#/components/schemas/Sequence'
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/SequenceStep' }

    SequenceStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        sequence_id: { type: string, format: uuid }
        step_index: { type: integer }
        scheduled_at: { type: string, format: date-time }
        template_id: { type: string, format: uuid, nullable: true }
        rendered_body: { type: string, nullable: true }
        approval_id: { type: string, format: uuid, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        failed_reason: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        status: { type: string, enum: [pending_evaluation,scheduled,approved,denied,sent,blocked,failed] }

    SequencePauseRequest:
      type: object
      properties:
        reason: { type: string }

    MessageTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        name: { type: string }
        persona: { type: string, enum: [CTO,CEO,Founder,Recruiter,HiringManager,Client,Peer,General] }
        category: { type: string, enum: [general,connection,sequence_step,proposal,follow_up] }
        tone: { type: string }
        body_template: { type: string }
        variables:
          type: array
          items: { type: object }
        active: { type: boolean }
        version: { type: integer }

    MessageTemplateCreate:
      type: object
      required: [name, persona, body_template]
      properties:
        name: { type: string }
        persona: { type: string, enum: [CTO,CEO,Founder,Recruiter,HiringManager,Client,Peer,General] }
        category: { type: string, default: general }
        tone: { type: string }
        body_template: { type: string }
        variables:
          type: array
          items: { type: object }

    # ---- KB -----------------------------------------------------------------
    KbRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        category: { type: string, enum: [skill,experience,project,tech,domain,achievement,goal,target_company,target_role,positioning,voice_sample,case_study] }
        fact: { type: string }
        structured: { type: object, additionalProperties: true }
        source: { type: string, enum: [user_upload,linkedin_consented,manual] }
        embedding_id: { type: string, format: uuid, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KbRecordCreate:
      type: object
      required: [category, fact]
      properties:
        category: { type: string, enum: [skill,experience,project,tech,domain,achievement,goal,target_company,target_role,positioning,voice_sample,case_study] }
        fact: { type: string, minLength: 1 }
        structured: { type: object, additionalProperties: true }
        source: { type: string, enum: [user_upload,linkedin_consented,manual], default: manual }

    KbRecordUpdate:
      type: object
      properties:
        fact: { type: string }
        structured: { type: object, additionalProperties: true }
        expected_version: { type: integer }

    # ---- Analytics ----------------------------------------------------------
    ContentAnalytics:
      type: object
      properties:
        impressions: { type: integer }
        engagements: { type: integer }
        followers_delta: { type: integer }
        by_pillar:
          type: array
          items:
            type: object
            properties:
              pillar: { type: string }
              impressions: { type: integer }
              engagements: { type: integer }
        time_series:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              impressions: { type: integer }
              engagements: { type: integer }

    ProfileAnalytics:
      type: object
      properties:
        profile_views: { type: integer }
        search_appearances: { type: integer }
        connection_requests_received: { type: integer }
        time_series:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              views: { type: integer }
              searches: { type: integer }

    NetworkAnalytics:
      type: object
      properties:
        total_connections: { type: integer }
        growth_30d: { type: integer }
        warm_intro_count: { type: integer }
        stage_breakdown: { type: object, additionalProperties: { type: integer } }

    OutreachAnalytics:
      type: object
      properties:
        messages_sent: { type: integer }
        reply_rate: { type: number, minimum: 0, maximum: 1 }
        meetings_booked: { type: integer }
        sequence_count: { type: integer }

    FunnelAnalytics:
      type: object
      properties:
        stages:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              count: { type: integer }
              conversion_from_prev: { type: number, nullable: true }

    AccountHealth:
      type: object
      properties:
        h_c: { type: number, minimum: 0, maximum: 1 }
        h_c_computed_at: { type: string, format: date-time }
        components:
          type: object
          properties:
            acceptance_rate_30d: { type: number, minimum: 0, maximum: 1, description: 'A_r' }
            reply_rate_30d:       { type: number, minimum: 0, maximum: 1, description: 'R_r' }
            quota_utilization_7d: { type: number, minimum: 0, maximum: 1, description: 'Q_u' }
            tenure_factor:        { type: number, minimum: 0, maximum: 1, description: 'T_a' }
        active_config_version: { type: string }

    Digest:
      type: object
      properties:
        period: { type: string, enum: [weekly,monthly] }
        generated_at: { type: string, format: date-time }
        sections:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              summary: { type: string }
              items:
                type: array
                items: { type: object }

    # ---- Briefing -----------------------------------------------------------
    Briefing:
      type: object
      properties:
        member_id: { type: string, format: uuid }
        date: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        sections:
          type: object
          properties:
            approvals_due:
              type: array
              items: { $ref: '#/components/schemas/Approval' }
            hot_opportunities:
              type: array
              items: { $ref: '#/components/schemas/Opportunity' }
            engagement:
              type: array
              items: { $ref: '#/components/schemas/EngagementTask' }
            followups:
              type: array
              items: { $ref: '#/components/schemas/Sequence' }

    # ---- Approvals ----------------------------------------------------------
    ApprovalStatus:
      type: string
      enum: [pending,approved,rejected,expired,auto_executed]

    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [content_item,sequence_step,application,profile_edit,connection_request,outbound_message,job_apply,client_proposal_send] }
        resource_id: { type: string, format: uuid }
        action_type: { type: string }
        tier: { type: integer, minimum: 1, maximum: 5 }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        rule_version: { type: string }
        requested_by: { type: string, description: 'system:<service>' }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string, nullable: true }
        decided_reason: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    ApprovalPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve,reject] }
        edited_payload: { type: object, description: 'User-edited preview/payload, if any' }
        comment: { type: string }

    ApprovalBulkDecision:
      type: object
      required: [resource_type, approval_ids, decision]
      properties:
        resource_type: { type: string, enum: [content_item,sequence_step,application,profile_edit,connection_request,outbound_message,job_apply,client_proposal_send] }
        approval_ids:
          type: array
          items: { type: string, format: uuid }
        decision: { type: string, enum: [approve,reject] }
        edited_payload: { type: object }

    ApprovalDecisionResult:
      type: object
      properties:
        approval: { $ref: '#/components/schemas/Approval' }
        governance:
          type: object
          properties:
            permit: { type: boolean }
            failed_guard: { type: string, nullable: true }
            reason: { type: string, nullable: true }
            guards_passed:
              type: array
              items: { type: string }
            permit_token: { type: string, nullable: true, description: 'HSM-signed JWT, ≤60s TTL — only if permit=true' }
            evaluated_at: { type: string, format: date-time }
        trace_id: { type: string, format: uuid }

    # ---- Audit --------------------------------------------------------------
    AuditEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string }
        action: { type: string, enum: [content.publish,sequence.send,profile.edit,approval.decide,guard.deny,compliance.config_activated,compliance.restriction_detected,member.created,kb.record.created,opportunity.funnel_changed,oauth.token_refresh_failed] }
        resource_type: { type: string }
        resource_id: { type: string, format: uuid, nullable: true }
        before_state: { type: object, additionalProperties: true, nullable: true }
        after_state: { type: object, additionalProperties: true, nullable: true }
        outcome: { type: string, enum: [success,denied,failed] }
        reason: { type: string, nullable: true }
        checksum_sha256: { type: string, description: 'sha256(entity_id, prior_state, new_state, actor, timestamp)' }
        created_at: { type: string, format: date-time }

    AuditEventPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    # ---- Admin / Compliance -------------------------------------------------
    ComplianceConfigStatus:
      type: string
      enum: [draft,proposed,active,retired]

    ComplianceConfigPayload:
      type: object
      description: |
        Versioned payload (§12 caps + §4 weights + guard thresholds).
        Note: weights MUST sum to 1.0; integer base caps bounded per §12.
      properties:
        cap_base:
          type: object
          properties:
            connection_request:  { type: integer, minimum: 0, maximum: 100, default: 18 }
            direct_message:      { type: integer, minimum: 0, maximum: 100, default: 25 }
            comment:             { type: integer, minimum: 0, maximum: 100, default: 15 }
            like:                { type: integer, minimum: 0, maximum: 100, default: 40 }
            profile_edit_submit: { type: integer, minimum: 0, maximum: 10,  default: 3 }
            post_publish:        { type: integer, minimum: 0, maximum: 10,  default: 3 }
        warmup_floor_multiplier: { type: number, minimum: 0, maximum: 1, default: 0.3 }
        reserve_pct: { type: number, minimum: 0, maximum: 0.5, default: 0.15 }
        h_c_weights:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: 'w1, w2, w3, w4 — must sum to 1.0; static-checked at activate (§27)'
        min_spacing_seconds:
          type: object
          properties:
            connection_request: { type: integer, default: 90 }
            direct_message:     { type: integer, default: 60 }
            comment:            { type: integer, default: 45 }
            like:               { type: integer, default: 15 }
        min_h_c_per_tier:
          type: object
          properties:
            tier_1: { type: number, default: 0.0 }
            tier_2: { type: number, default: 0.3 }
            tier_3: { type: number, default: 0.4 }
            tier_4: { type: number, default: 0.5 }
            tier_5: { type: number, default: 0.5 }
        theta_phi_min: { type: number, minimum: 0, maximum: 1, default: 0.55 }
        j_min_seconds: { type: integer, default: 8 }

    ComplianceConfigVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: string, description: 'e.g. ccfg-2026-04-15-r3' }
        status: { $ref: '#/components/schemas/ComplianceConfigStatus' }
        payload: { $ref: '#/components/schemas/ComplianceConfigPayload' }
        two_reviewer_signed_by:
          type: array
          items: { type: string, format: uuid }
        activated_at: { type: string, format: date-time, nullable: true }
        activated_by: { type: string, nullable: true }
        previous_id: { type: string, format: uuid, nullable: true }

    ComplianceConfigVersionCreate:
      type: object
      required: [payload]
      properties:
        payload: { $ref: '#/components/schemas/ComplianceConfigPayload' }

    ComplianceConfigActivation:
      type: object
      required: [signers]
      properties:
        signers:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string, format: uuid }
          description: 'Two DISTINCT reviewer IDs (Non-Negotiable §4)'
        comment: { type: string }

    RestrictionState:
      type: object
      properties:
        member_id: { type: string, format: uuid }
        is_restricted: { type: boolean }
        restricted_since: { type: string, format: date-time, nullable: true }
        restricted_reason: { type: string, nullable: true, enum: [denial_rate,manual_review,oauth_expired,governance_fail,abuse_signal,none] }
        cleared_at: { type: string, format: date-time, nullable: true }
        cleared_by: { type: string, nullable: true }
