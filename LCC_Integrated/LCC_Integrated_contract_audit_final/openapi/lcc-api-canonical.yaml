# =============================================================================
# OKESON-LCC — Canonical REST API Contract (v1.0)
# =============================================================================
# Single source of truth for the public HTTP surface. Supersedes:
#   - schemas/openapi/openapi.yaml       (backend — 190 lines, 6 endpoints, /v1)
#   - schemas/openapi/api-gateway.yaml   (frontend — 1919 lines, 60 endpoints, no prefix)
#   - All ad-hoc routes the frontend builds with apiFetch(`…`)
#
# This file is consumed by:
#   • Frontend codegen  → packages/api-types/codegen
#   • Backend route tests → tests/contract/http
#   • Gateway wiring verification → api-gateway/src/state.rs UpstreamRegistry
#   • Integration tests → tests/integration/*
#
# Canonical namespace: /api/v1/<domain>/...
#   - /api/v1/auth/*           Identity Svc  (OAuth2/PKCE + refresh + logout)
#   - /api/v1/members/*        Identity Svc  (self-only member CRUD)
#   - /api/v1/profile/*        Profile Svc   (per-member)
#   - /api/v1/content/*        Content Svc   (per-member)
#   - /api/v1/engagement/*     Engagement Svc (per-member)
#   - /api/v1/contacts/*       Network/CRM Svc (per-member)
#   - /api/v1/opportunities/*  Opportunity Svc (per-member)
#   - /api/v1/sequences/*      Outreach Svc   (per-member)
#   - /api/v1/kb/*             KB Svc (or Content/Profile owner)
#   - /api/v1/analytics/*      Analytics Svc (per-member)
#   - /api/v1/briefing/*       Briefing (Orchestrator read)
#   - /api/v1/approvals/*      Approval Svc (per-member)
#   - /api/v1/audit/*          Audit Svc  (admin / auditor only)
#   - /api/v1/admin/*          Compliance admin (Compliance Governor / Identity)
#   - /healthz, /readyz, /metrics  api-gateway infra
#
# AuthN/AuthZ
#   - Bearer JWT (HS256) issued by Identity Svc; audience=lcc-api; issuer=lcc-auth
#   - RBAC: Owner | Assistant | Reviewer | Admin | Auditor
#   - Tenant isolation: every <domain>/* route is member-scoped; RLS-enforced.
#   - /api/v1/auth/* is unauthenticated; /api/v1/admin/* requires role=Admin.
#
# Request conventions
#   - Content-Type: application/json
#   - Idempotency-Key header (UUIDv4) on every non-GET (mandatory for mutations)
#   - X-Trace-Id (UUIDv4) generated by api-gateway; echoed in response
#   - X-Member-Id: required by Gateway→upstream forwarding for RLS
#
# Response conventions
#   - Error envelope:
#       { "error": { "code": "VALIDATION_ERROR", "message": "…", "details": {}, "trace_id": "…" } }
#   - Rate-limit headers on every response:
#       X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After
#   - Pagination: cursor-based (?cursor=<opaque>&limit=<1..100>); next_cursor, has_more
#
# Realtime companion: lcc-realtime-v1.yaml (WebSocket + SSE)
# Schema companion:    lcc-schemas-v1.yaml (shared component schemas)
# =============================================================================

openapi: 3.1.0
info:
  title: OKESON-LCC Public API
  version: 1.0.0
  description: |
    Canonical REST contract for the LinkedIn Command Center (LCC / OKESON).
    This document is the binding specification for the api-gateway, every
    domain service, the Frontend API client, the gateway routing table, and
    the integration test suite.
  contact:
    name: OKESON Backend Team
    email: backend@okeson.example
  license:
    name: Proprietary

servers:
  - url: https://api.lcc.okeson.example/api/v1
    description: Production
  - url: https://api.staging.lcc.okeson.example/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: infra
    description: Liveness / readiness / metrics (unauthenticated, infra-only)
  - name: auth
    description: OAuth 2.0 + PKCE handshake and session management (Identity Svc)
  - name: members
    description: Member account self-service (Identity Svc)
  - name: profile
    description: Profile snapshot, audit, edit drafts (Profile Svc)
  - name: content
    description: ContentItem lifecycle (Content Svc)
  - name: engagement
    description: Engagement queue, reply drafts, inbox (Engagement Svc)
  - name: contacts
    description: Network/CRM contacts, companies, interactions (Network/CRM Svc)
  - name: opportunities
    description: Opportunity discovery, scoring, applications, proposals (Opportunity Svc)
  - name: sequences
    description: Outreach sequences, steps, templates (Outreach Svc)
  - name: kb
    description: Professional Knowledge Base records (KB Svc)
  - name: analytics
    description: Aggregate dashboards, digests, account-health (Analytics Svc)
  - name: briefing
    description: Daily / weekly briefing assembly (Orchestrator)
  - name: approvals
    description: Approval queue and decisions (Approval Svc)
  - name: audit
    description: Audit log read access (Audit Svc)
  - name: admin
    description: Compliance config, restrictions (Identity + Compliance Governor)

# -----------------------------------------------------------------------------
# PATHS
# -----------------------------------------------------------------------------
paths:

  # ============================ INFRA ============================
  /healthz:
    get:
      tags: [infra]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: api-gateway alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [infra]
      operationId: readyz
      summary: Readiness probe — verifies per-upstream health within 750 ms budget
      security: []
      responses:
        '200': { description: All upstreams reachable, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: At least one upstream unreachable; body lists failing upstream(s) }

  /metrics:
    get:
      tags: [infra]
      operationId: metrics
      summary: Prometheus scrape endpoint (text/plain)
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }

  # ============================ AUTH =============================
  /auth/linkedin/start:
    get:
      tags: [auth]
      operationId: startLinkedInOAuth
      summary: Begin LinkedIn OAuth2 + PKCE handshake
      security: []
      parameters:
        - in: query
          name: return_to
          schema: { type: string, format: uri }
      responses:
        '302':
          description: Redirect to LinkedIn authorize endpoint
          headers:
            Set-Cookie: { schema: { type: string } }
            Location:   { schema: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/linkedin/callback:
    get:
      tags: [auth]
      operationId: linkedInOAuthCallback
      summary: Complete LinkedIn OAuth handshake — exchanges `code` for tokens, sets cookies, redirects to `return_to`
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string, description: 'OAuth error code surfaced by LinkedIn' }
      responses:
        '302':
          description: Redirect to `return_to` with session cookies set
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate access + refresh tokens (refresh-token single-use)
      security: []
      parameters:
        - in: cookie
          name: lcc_refresh
          schema: { type: string }
      responses:
        '200':
          description: New tokens set in cookies + body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke refresh token, clear session, optionally revoke LinkedIn grant
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ MEMBERS ==========================
  /members/me:
    get:
      tags: [members]
      operationId: getCurrentMember
      summary: Current authenticated member's profile
      responses:
        '200':
          description: Member profile (self-only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /members/me/settings:
    patch:
      tags: [members]
      operationId: updateMemberSettings
      summary: Update timezone, active_goal_mode, soft caps; cap changes trigger Compliance config version deploy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberSettingsUpdate' }
      responses:
        '200':
          description: Updated member settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Compliance config activation is required before this cap change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /members/{memberId}/export:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [members]
      operationId: exportMemberData
      summary: GDPR/CCPA export — full data dump for the member
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================ BRIEFING =========================
  /members/{memberId}/briefing/today:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [briefing]
      operationId: getDailyBriefing
      summary: Daily briefing assembly (Opportunities + Approvals + Engagement + Followups)
      responses:
        '200':
          description: Briefing payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Briefing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================ PROFILE ==========================
  /members/{memberId}/profile/snapshots/latest:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [profile]
      operationId: getLatestProfileSnapshot
      summary: Latest profile snapshot
      responses:
        '200':
          description: ProfileSnapshot (raw_cache_ttl_at ≤ now+24h)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /members/{memberId}/profile/audit:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [profile]
      operationId: runProfileAudit
      summary: Run profile audit — returns Health Score + prioritized findings
      responses:
        '202':
          description: Audit job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileAuditJob' }
        '200':
          description: Synchronous audit result (when run inline)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileAuditResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /members/{memberId}/profile/edit-drafts:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [profile]
      operationId: generateProfileEditDrafts
      summary: Generate profile edit drafts (Tier-1 — auto-generated, no approval)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileEditDraftRequest' }
      responses:
        '200':
          description: Generated edit drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfileEditDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /members/{memberId}/profile/edit-drafts/{draftId}/approve:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: draftId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [profile]
      operationId: approveProfileEditDraft
      summary: Approve a profile edit draft (Tier-1 — flips draft state; manual apply per §3.1)
      responses:
        '200':
          description: Approved draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEditDraft' }
        '409':
          description: Draft already approved or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /members/{memberId}/profile/strength-history:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: query
        name: range
        schema: { type: string, enum: ['7d','30d','90d','365d'], default: '90d' }
    get:
      tags: [profile]
      operationId: getProfileStrengthHistory
      summary: Strength score time-series
      responses:
        '200':
          description: Time-series points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfileStrengthPoint' }

  # ============================ CONTENT ==========================
  /members/{memberId}/content:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: query
        name: status
        schema: { $ref: '#/components/schemas/ContentItemStatus' }
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [content]
      operationId: listContentItems
      summary: List content items (filter by status)
      responses:
        '200':
          description: Paged list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentPage' }
    post:
      tags: [content]
      operationId: createContentItem
      summary: Create content item (idea → drafting). Tier-1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }

  /members/{memberId}/content/{contentId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contentId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [content]
      operationId: getContentItem
      summary: Get one content item
      responses:
        '200':
          description: ContentItem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [content]
      operationId: updateContentItem
      summary: Update a content item (only allowed in `idea`/`drafting`/`rejected` states)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        '409':
          description: Conflict (optimistic-concurrency version mismatch)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [content]
      operationId: deleteContentItem
      summary: Soft-delete (only allowed pre-publishing)
      responses:
        '204': { description: Soft-deleted }

  /members/{memberId}/content/compose:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [content]
      operationId: composeContent
      summary: Run composer — returns 2-3 draft variants (gated by ai-worker + brand-guard)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentComposeRequest' }
      responses:
        '200':
          description: Variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentVariants' }

  /members/{memberId}/content/{contentId}/quality-check:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contentId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [content]
      operationId: runQualityCheck
      summary: Run brand-guard linter (tone/grammar/fluff/banned phrases/grounding)
      responses:
        '200':
          description: QualityReport
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityReport' }

  /members/{memberId}/content/{contentId}/submit-for-approval:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contentId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [content]
      operationId: submitContentForApproval
      summary: drafting → pending_approval (creates Approval row, Tier-2 publish)
      responses:
        '200':
          description: Approval queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        '412':
          description: Pre-condition failed (e.g., grounding empty, version conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /members/{memberId}/content/{contentId}/schedule:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contentId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [content]
      operationId: scheduleContent
      summary: Schedule a content item for publish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentScheduleRequest' }
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }

  /members/{memberId}/content/calendar:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: query
        name: from
        schema: { type: string, format: date-time }
      - in: query
        name: to
        schema: { type: string, format: date-time }
    get:
      tags: [content]
      operationId: getContentCalendar
      summary: Calendar view of scheduled + pending content
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentCalendarEntry' }

  # ============================ ENGAGEMENT =======================
  /members/{memberId}/engagement/inbox:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [engagement]
      operationId: getEngagementInbox
      summary: Unified inbox (DMs + comments + connection requests)
      responses:
        '200':
          description: Inbox page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPage' }

  /members/{memberId}/engagement/queue:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [engagement]
      operationId: getEngagementQueue
      summary: Daily engagement ritual queue
      responses:
        '200':
          description: Engagement tasks (queued/drafted)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EngagementTask' }

  /members/{memberId}/engagement/tasks/{taskId}/draft-reply:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: taskId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [engagement]
      operationId: draftReply
      summary: Generate reply variants for an engagement task
      responses:
        '200':
          description: Variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplyVariants' }

  /members/{memberId}/engagement/tasks/{taskId}/approve:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: taskId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [engagement]
      operationId: approveEngagementTask
      summary: Approve a reply/comment/congratulation send (Tier-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngagementApproveRequest' }
      responses:
        '200':
          description: Approval queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }

  /members/{memberId}/engagement/tasks/{taskId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: taskId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [engagement]
      operationId: dismissEngagementTask
      summary: Dismiss an engagement task
      responses:
        '204': { description: Dismissed }

  # ============================ CONTACTS / CRM ==================
  /members/{memberId}/contacts:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: query
        name: q
        schema: { type: string, description: 'Search by name/title/linkedin_url' }
      - in: query
        name: tier
        schema: { type: string, enum: [VIP,standard,peer] }
      - in: query
        name: relationship_stage
        schema: { type: string, enum: [cold,connected,engaged,conversation,opportunity,closed] }
      - in: query
        name: tag
        schema: { type: string }
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [contacts]
      operationId: listContacts
      summary: List/search contacts
      responses:
        '200':
          description: Contacts page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
    post:
      tags: [contacts]
      operationId: createContact
      summary: Create or import a contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }

  /members/{memberId}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contactId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [contacts]
      operationId: getContact
      summary: Get contact detail
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Update contact (tags, tier, notes, relationship_stage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }

  /members/{memberId}/contacts/{contactId}/interactions:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contactId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [contacts]
      operationId: listContactInteractions
      summary: Interaction log for a contact
      responses:
        '200':
          description: Interactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Interaction' }
    post:
      tags: [contacts]
      operationId: logContactInteraction
      summary: Log a manual interaction with this contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionCreate' }
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interaction' }

  /members/{memberId}/contacts/stale:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [contacts]
      operationId: getStaleContacts
      summary: Contacts past staleness threshold (VIP 30d / standard 60d / peer 90d)
      responses:
        '200':
          description: Stale contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }

  /members/{memberId}/contacts/{contactId}/purge:
    parameters:
      - $ref: '#/components/parameters/MemberId'
      - in: path
        name: contactId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [contacts]
      operationId: purgeContact
      summary: GDPR/CCPA purge — anonymize interaction log, hard-delete contact, nullify sequence targets
      responses:
        '204': { description: Purged }

